[workspace]
members = [
  "crates/symphony-core",
  "crates/symphony-config",
  "crates/symphony-workflow",
  "crates/symphony-tracker",
  "crates/symphony-tracker-linear",
  "crates/symphony-workspace",
  "crates/symphony-codex",
  "crates/symphony-cli",
  "crates/symphony-observability",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
graphql-parser = "0.4"
minijinja = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "time", "io-util", "fs", "signal"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
tracing-appender = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ratatui = "0.28"
crossterm = "0.28"
